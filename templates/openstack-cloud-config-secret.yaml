# yamllint disable rule:document-start
# yamllint disable rule:line-length

{{- $namespace := include "rancher-cluster-templates.derivedNamespace" $ }}
{{- $clusterName := include "rancher-cluster-templates.clusterName" $ }}
{{- $suffix := include "rancher-cluster-templates.randomString" . }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $clusterName }}-cloud-config-{{ $suffix }}
  namespace: {{$namespace}}
  annotations:
    rke.cattle.io/object-authorized-for-clusters: {{ $clusterName | quote }}
    #provisioning.cattle.io/owned-by: {{ printf "%s/%s" $namespace $clusterName }}
type: Opaque
stringData:
  cloud.conf: |
{{ include "rancher-cluster-templates.cloudConfig" . | indent 4 }}