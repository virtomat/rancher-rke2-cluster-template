# Application-owned HTTPS route.
# Bind to the administrator-added listener with sectionName. The hostname must
# match the listener and the Certificate. The Service `shop` on port 80 is
# expected to exist; this example does not deploy an application image.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: shop
  namespace: shop
spec:
  parentRefs:
    - name: shared-gateway
      namespace: kube-system
      kind: Gateway
      sectionName: shop-https
  hostnames:
    - shop.example.com
  rules:
    - backendRefs:
        - name: shop
          port: 80
