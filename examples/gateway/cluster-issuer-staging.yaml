# Staging ACME issuer for the shared Gateway HTTP listener.
# Replace the placeholder email and review the ACME account Secret name before
# use. Do not use the production ACME directory for the first issuance.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-staging
spec:
  acme:
    email: admin@example.com
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    privateKeySecretRef:
      name: letsencrypt-staging-account-key
    solvers:
      - http01:
          gatewayHTTPRoute:
            parentRefs:
              - name: shared-gateway
                namespace: kube-system
                kind: Gateway
                sectionName: web
