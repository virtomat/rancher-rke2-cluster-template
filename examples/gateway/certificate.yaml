# One Certificate and TLS Secret per domain.
# The application namespace must carry the `gateway-access: public` opt-in
# label so cert-manager's temporary HTTP-01 route can attach to the shared
# HTTP `web` listener. Start with the staging issuer.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: shop-example-com
  namespace: shop
spec:
  secretName: shop-example-com-tls
  dnsNames:
    - shop.example.com
  issuerRef:
    name: letsencrypt-staging
    kind: ClusterIssuer
    group: cert-manager.io
