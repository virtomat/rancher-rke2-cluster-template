# yamllint disable rule:document-start
# yamllint disable rule:line-length

# Simple or Advanced
configMode: Simple
nodePoolTemplate: SinglePool
nodePoolCounts:
  master:
  worker:

# Cloud Init definition
# https://cloudinit.readthedocs.io/en/latest/reference/modules.html

x-openstackconfig: &openstackconfig
  activeTimeout:
  # availabilityZone:
  # Zero-local-disk workload flavors require a Cinder boot volume.
  bootFromVolume: true
  # cacert:
  configDrive: true
  # domainId:
  # domainName:
  # endpointType: # (adminURL, internalURL or publicURL)
  # flavorId:
  flavorName: ""
  # floatingipPool:
  # imageId:
  imageName: ""
  # insecure: # Default: false
  # ipVersion:  # Default: 4
  # netId:
  netName: ""
  # novaNetwork: # Default: false
  secGroups: "" # Comma separated list (no spaces before and after)
  # sshPort:  # Default: 22
  # sshUser:  # Default: ubuntu
  # tenantDomainId:
  # tenantDomainName:
  # tenantId:
  # tenantName:
  # userDataFile: *userDataFile
  # userDomainId:
  # userDomainName:
  # userId:
  # username:
  # volumeDevicePath:
  # volumeId:
  # volumeName:
  volumeSize: 40
  # Empty selects the environment-default Cinder volume type.
  volumeType: ""

# cluster values
cluster:
  name: test
  # labels:
  #   key: value
  # annotations:
  #   key: value
  # description: ""
  config:
    # agentEnvs: {}

    openstack:
      applicationCredentialSecretName: ""
      # Onboarding-owned key and Secret conventions; they are not UI inputs.
      defaultKeypairName: bootstrap
      defaultPrivateKeyFileSecretName: openstack-privatekey
      sshPort: 22
      sshUser: ubuntu
      secGroups: k8s-rke2
      # Comma-separated names without spaces; attached only to a single master.
      publicIngressSecGroups: k8s-rke2-public-ingress
      imageId:
      imageName: ubuntu-24.04
      masterFlavorId:
      masterFlavorName: c1.medium
      workerFlavorId:
      workerFlavorName: s1.medium
      # Rancher NodeDriver floating-IP network name; this is not the CCM network UUID.
      # Used only for the master nodepool when the effective master count is exactly 1.
      floatingipPool: ext_net_gts
      netId:
      netName: local-net

      # Onboarding-owned CCM network Secret convention; it is not a UI input.
      ccmNetConfigSecretName: "os-ccm-net-config"

    # defaultClusterRoleForProjectMembers:
    # defaultPodSecurityAdmissionConfigurationTemplateName:
    # defaultPodSecurityPolicyTemplateName:
    # enableNetworkPolicy:  # Default: false

    kubernetesVersion: "v1.35.9+rke2r1"

