    #     enabled: false
    #     # deleteEmptyDirData: true
    #     # disableEviction: false
    #     # force: false
    #     # gracePeriod: -1
    #     # ignoreDaemonSets: true
    #     # ignoreErrors: false
    #     # skipWaitForDeleteTimeoutSeconds: 0
    #     # timeout: 120

    # Packaged RKE2 Traefik add-on (rke2-traefik) Gateway baseline. The chart
    # forces the topology and Gateway invariants below from the effective master
    # count; user chartValues may add resources such as extra Gateway listeners
    # but cannot replace these values.
    #
    # Single master (default): one Traefik DaemonSet pinned by the template to
    # Linux control-plane nodes (with control-plane/etcd tolerations), host
    # ports 80/443, ClusterIP Service reached through the node's existing
    # floating IP. HA (>=3 masters): one Traefik DaemonSet with hostPorts
    # cleared and a single LoadBalancer Service served by CCM/Octavia, with no
    # single-master nodeSelector or tolerations forced.
    #
    # The Gateway listener port is the internal packaged entrypoint port (8000);
    # the Service/hostPort mapping publishes it as external port 80. The Gateway
    # serves HTTP only by default: no HTTPS listener, Certificate, Secret,
    # issuer, or certificateRef is embedded. External port 443 and the websecure
    # entrypoint remain published/allocated so an administrator can add HTTPS
    # listeners later; they are not a claim that HTTPS is served now. The
    # websecure entrypoint's global self-signed TLS default is disabled so no
    # certificate is generated or served until a Gateway HTTPS listener with
    # certificateRefs is configured.
    chartValues:
      rke2-traefik:
        deployment:
          kind: DaemonSet
        hostNetwork: false
        ingressClass:
          enabled: false
        gateway:
          enabled: true
          name: shared-gateway
          namespace: kube-system
          listeners:
            web:
              port: 8000
              protocol: HTTP
              namespacePolicy:
                from: Selector
                selector:
                  matchLabels:
                    gateway-access: public
        gatewayClass:
          enabled: true
          name: traefik
        providers:
          kubernetesCRD:
            enabled: false
          kubernetesGateway:
            enabled: true
            experimentalChannel: false
          kubernetesIngress:
            enabled: false
          kubernetesIngressNGINX:
            enabled: false
        service:
          enabled: true
          single: true
          spec:
            type: ClusterIP
        ports:
          web:
            port: 8000
            hostPort: 80
          websecure:
            port: 8443
            hostPort: 443
            http:
              tls:
                enabled: false

nodepools:
  - name: master
    # displayName:  # Default: $nodepool.name
    quantity: 1
    etcdRole: true
    controlPlaneRole: true
    workerRole: false
    labels:
      #node-role.kubernetes.io/control-plane: "true"
      node.kubernetes.io/control-plane: "true"
      node.kubernetes.io/exclude-from-external-load-balancers: "true"
    # taints:
